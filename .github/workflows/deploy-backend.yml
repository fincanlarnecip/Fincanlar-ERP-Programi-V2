name: Deploy Backend to Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Restore clasp credentials
        run: echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Push to Apps Script (hata olsa da devam et, logu kaydet)
        working-directory: backend
        continue-on-error: true
        run: clasp push --force > ../deploy-log.txt 2>&1 || true

      - name: Deploy (hata olsa da devam et, logu ekle)
        working-directory: backend
        continue-on-error: true
        run: |
          clasp deploy --description "Auto-deploy from GitHub $(date +'%Y-%m-%d %H:%M')" >> ../deploy-log.txt 2>&1 || true
          echo "===DEPLOYMENTS===" >> ../deploy-log.txt
          clasp deployments >> ../deploy-log.txt 2>&1 || true

      - name: Log dosyasını repoya kaydet (teşhis için)
        run: |
          git config user.name "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git add deploy-log.txt
          git commit -m "deploy log" || echo "değişiklik yok"
          git push
