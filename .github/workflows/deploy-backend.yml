name: Deploy Backend to Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Restore clasp credentials
        run: echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Push to Apps Script
        working-directory: backend
        run: clasp push --force

      - name: Deploy (ilk çalıştırma - dağıtım ID'si burada oluşacak)
        working-directory: backend
        run: |
          clasp deploy --description "Auto-deploy from GitHub $(date +'%Y-%m-%d %H:%M')"
          echo "===DEPLOYMENTS-LIST-START==="
          clasp deployments
          echo "===DEPLOYMENTS-LIST-END==="
